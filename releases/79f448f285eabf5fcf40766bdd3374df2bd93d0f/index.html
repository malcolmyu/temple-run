  <body>
    <details id="startup-diagnostics" style="position:fixed;top:0;left:0;max-width:100%;z-index:9999;background:#10271fed;color:#fff;font:11px monospace;padding:5px;max-height:45vh;overflow:auto"><summary id="startup-summary">版本 79f448f285ea · 启动中</summary><pre id="startup-stages" style="white-space:pre-wrap"></pre></details>
    <script>
    (()=>{
      const t=window.__startupTiming={version:'79f448f285ea',mode:new URLSearchParams(location.search).get('quality')==='native'?'native':'quick',marks:{html:performance.now()},longTasks:[],resources:[],mark(name){if(this.marks[name]!==undefined)return;this.marks[name]=performance.now();this.paint();},paint(){
        const m=this.marks, span=(a,b)=>m[a]===undefined?'未进入／此模式不适用':m[b]===undefined?'进行中':Math.round(m[b]-(m[a]||0))+'ms';
        const nav=performance.getEntriesByType('navigation')[0];const pack=performance.getEntriesByType('resource').find(r=>r.name.includes('/opening.')); 
        document.getElementById('startup-summary').textContent='版本 '+this.version+' · '+this.mode+' · '+(m.ready?'可开始 '+Math.round(m.ready)+'ms':'加载 '+Math.round(performance.now())+'ms');
        document.getElementById('startup-stages').textContent=[
          'HTML响应: '+(nav?Math.round(nav.responseStart)+'ms':'等待'),
          'HTML→应用执行（含下载/解析/执行）: '+span('html','app-module-executed'),
          '游戏模块导入（含下载/执行）: '+span('game-import-start','game-import-end'),
          '开局包网络（含预加载）: '+(pack?Math.round(pack.duration)+'ms；传输 '+pack.transferSize+'B':m['pack-parsed']?'持久缓存读取完成（无网络请求）':'等待／读取中'),
          '消费开局包等待: '+span('init-start','pack-downloaded'),
          '开局JSON解析: '+span('pack-downloaded','pack-parsed'),
          '场景准备（与角色并行）: '+span('pack-parsed','world-ready'),
          '场景完成→角色就绪: '+span('world-ready','runner-ready'),
          '重置场景/首帧: '+span('runner-ready','first-frame'),
          '脚本下载详见下方；解析/执行含在模块等待内，不假报纯解析时间',
          '持久缓存: '+JSON.stringify(window.__assetCache||{}),
          '详情 window.__startupTiming；时间相对导航起点',
          ...this.resources.map(r=>r.name.split('/').pop()+':下载 '+Math.round(r.responseEnd-r.responseStart)+'ms / 等待 '+Math.round(r.responseStart-r.startTime)+'ms')].join('\n');
      }};
      new PerformanceObserver(list=>{for(const r of list.getEntries())if(!t.marks.ready)t.resources.push(r.toJSON());t.paint();}).observe({type:'resource',buffered:true});
      try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!t.marks.ready)t.longTasks.push(e.toJSON());}).observe({type:'longtask',buffered:true});}catch{}
      const timer=setInterval(()=>{t.paint();if(t.marks.ready)clearInterval(timer);},200);t.paint();
      // Begin the real hash-addressed pack before the game module has downloaded.
      // Consult persistent storage first; never redownload it just to preload.
      if(t.mode==='quick'&&new URLSearchParams(location.search).get('cache')!=='off'){
        const early=window.__earlyOpening={url:new URL('assets/runtime/opening.9d4df254d605.json',document.baseURI).href,hit:false,promise:null};
        early.promise=(async()=>{
          try{
            const store=await Promise.race([caches.open('temple-payload-v2-'+t.version),new Promise(resolve=>setTimeout(()=>resolve(null),200))]);
            const hit=store?await Promise.race([store.match(early.url),new Promise(resolve=>setTimeout(()=>resolve(null),200))]):null;
            if(hit){early.hit=true;return hit;}
          }catch{}
          return fetch(early.url);
        })().catch(()=>null);
      }
    })();
    </script>
    <div id="app"><div style="min-height:100dvh;display:grid;place-content:center;text-align:center;background:#173529;color:#f2d79b;font:18px Georgia,serif"><h1>TEMPLE RUN</h1><p>神庙逃亡</p><p style="font:14px system-ui">正在准备道路与操作…</p></div></div>
  </body>
