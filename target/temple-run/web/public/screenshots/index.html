<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>神庙逃亡 Web · 验收截图</title>
  <style>
    body{margin:0;background:#0b1512;color:#e9dfc8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
    h1{font-size:26px;font-weight:600;margin:0 0 6px}
    p{color:#9fb4a5;margin:0 0 22px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    figure{margin:0;background:#11211b;border:1px solid #274438;border-radius:14px;overflow:hidden}
    img{display:block;width:100%;height:auto}
    figcaption{padding:10px 14px;color:#d8c9a3}
    a{color:#f0c36a}
  </style>
</head>
<body>
<main>
  <h1>神庙逃亡 Web · 验收截图</h1>
  <p>当前线上版本 <a href="../">https://malcolmyu.github.io/temple-run/</a>。下面三张是转弯清空、护盾翼、半边路。</p>
  <div class="grid">
    <figure><img src="./current/turn-clear.png" alt="转弯区已清空"><figcaption>转弯区：树冠/灌木已清空</figcaption></figure>
    <figure><img src="./current/shield-wings.png" alt="护盾翼"><figcaption>护盾激活时的翼装视觉</figcaption></figure>
    <figure><img src="./current/half-road.png" alt="半边路"><figcaption>半边路：左半幅可走，右侧坠崖</figcaption></figure>
  </div>
</main>
</body>
</html>
