<!doctype html><html><meta charset="utf-8"><title>Original mesh identification</title><body style="margin:0;background:#182323;color:white"><p id="status">Loading original static meshes…</p><canvas id="sheet"></canvas><script type="module">
import * as THREE from 'three';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const base='/@fs/Users/yuminghao/Work/temple-run/target/temple-run/analysis/entrance-search/';
const all=await (await fetch(base+'manifest.json')).json();
const page=Number(new URLSearchParams(location.search).get('page')||0);const items=all.slice(page*40,page*40+40);

</script></body></html>
